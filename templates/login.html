{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Sign In</h2>
  <p class="subtitle">Authenticate with your credentials to begin a monitored session.</p>
  <form method="POST">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" placeholder="e.g. chandika" required autofocus/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter password" required/>
    </div>
    <button type="submit" class="btn btn-primary btn-full">Login →</button>
  </form>
  <p class="auth-link">No account? <a href="{{ url_for('register') }}">Register here</a></p>
</div>
{% endblock %}
